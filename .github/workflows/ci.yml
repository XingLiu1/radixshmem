name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit uv
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: DCO sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            range="$BASE..$HEAD"
          else
            range="-1 $HEAD"
          fi
          status=0
          for c in $(git rev-list --no-merges $range); do
            git log -1 --format=%B "$c" > /tmp/msg
            tools/check_signoff.sh /tmp/msg || { echo "  in $(git log -1 --format='%h %s' "$c")"; status=1; }
          done
          exit $status

  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y build-essential pkg-config \
            libibverbs-dev libxxhash-dev libzmq3-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/registry/etcd_go/go.mod
          cache-dependency-path: src/registry/etcd_go/go.sum
      - name: Install Python build deps
        run: pip install cmake==3.31.6 pybind11==3.1.0 numpy "grpcio>=1.60" setuptools pytest
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DENABLE_MOONCAKE=OFF \
            -DENABLE_NIXL=OFF \
            -DPython3_EXECUTABLE="$(command -v python)"
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Install Python package
        run: pip install --no-build-isolation -e python
      - name: Timeout regression fails on the unmodified base
        run: |
          cp python/radixshmem/server.py /tmp/radix-server-fixed.py
          git show 19e80154e32898bab88b7ea9dd2d60ee290ead21:python/radixshmem/server.py > python/radixshmem/server.py
          set +e
          PYTHONPATH=python python -m pytest -q python/tests/test_server_rpc.py -k test_timed_out_pull_keeps_pins_slots_and_budget_until_release > /tmp/timeout-base.log 2>&1
          rc=$?
          set -e
          mv /tmp/radix-server-fixed.py python/radixshmem/server.py
          cat /tmp/timeout-base.log
          test "$rc" -eq 1
          python -c 'from pathlib import Path; s=Path("/tmp/timeout-base.log").read_text(); assert "4 failed" in s and "DID NOT RAISE" in s'
          git diff --exit-code -- python/radixshmem/server.py
      - name: Timeout regression passes with the fix
        run: PYTHONPATH=python python -m pytest -v python/tests/test_server_rpc.py -k test_timed_out_pull_keeps_pins_slots_and_budget_until_release
      - name: Test
        run: ctest --test-dir build --output-on-failure
