name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit uv
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: DCO sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            range="$BASE..$HEAD"
          else
            range="-1 $HEAD"
          fi
          status=0
          for c in $(git rev-list --no-merges $range); do
            git log -1 --format=%B "$c" > /tmp/msg
            tools/check_signoff.sh /tmp/msg || { echo "  in $(git log -1 --format='%h %s' "$c")"; status=1; }
          done
          exit $status

  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install system packages
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y build-essential pkg-config \
            libibverbs-dev libxxhash-dev libzmq3-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/registry/etcd_go/go.mod
          cache-dependency-path: src/registry/etcd_go/go.sum
      - name: Install Python build deps
        run: pip install cmake==3.31.6 pybind11==3.1.0 numpy "grpcio>=1.60" setuptools pytest
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DENABLE_MOONCAKE=OFF \
            -DENABLE_NIXL=OFF \
            -DPython3_EXECUTABLE="$(command -v python)"
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Install Python package
        run: pip install --no-build-isolation -e python
      - name: Regressions fail against the original release implementations
        run: |
          cp src/transfer/slot_transfer.cpp /tmp/slot-transfer-fixed.cpp
          cp src/transfer/mooncake/mooncake_backend.cpp /tmp/mooncake-backend-fixed.cpp
          git show 19e80154e32898bab88b7ea9dd2d60ee290ead21:src/transfer/slot_transfer.cpp > src/transfer/slot_transfer.cpp
          git show 19e80154e32898bab88b7ea9dd2d60ee290ead21:src/transfer/mooncake/mooncake_backend.cpp > src/transfer/mooncake/mooncake_backend.cpp
          cmake --build build --target test_slot_geometry test_mooncake_release -j 2
          python - <<'PY'
          import resource, subprocess
          resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
          for name, marker in [('test_slot_geometry', 'detach_peer("peerK") == XFER_EBUSY'), ('test_mooncake_release', 'backend->poll(h, &bytes)')]:
              r = subprocess.run(['build/bin/' + name], capture_output=True, text=True)
              print(name, 'base exit:', r.returncode, flush=True)
              print(r.stdout + r.stderr, flush=True)
              assert r.returncode == -6 and marker in r.stderr, (name, r.returncode)
          PY
          mv /tmp/slot-transfer-fixed.cpp src/transfer/slot_transfer.cpp
          mv /tmp/mooncake-backend-fixed.cpp src/transfer/mooncake/mooncake_backend.cpp
          git diff --exit-code -- src/transfer
      - name: Regressions pass with the fix
        run: |
          cmake --build build --target test_slot_geometry test_mooncake_release -j 2
          ctest --test-dir build -R '^(test_slot_geometry|test_mooncake_release)$' -V
      - name: Test
        run: ctest --test-dir build --output-on-failure
